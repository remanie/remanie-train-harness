name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo fetch --locked
      - run: python3 checks/licenses.py --check
      - run: cargo build --release --locked
      - uses: actions/cache@v4.3.0
        id: grok
        with:
          path: target/grok-build/out
          key: grok-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build_grok.py') }}
      - if: steps.grok.outputs.cache-hit != 'true'
        run: python3 build_grok.py
      - run: python3 package_linux.py target/release/remanie-train-harness target/grok-build/out runtime
      - run: python3 -m pip install pytest==9.2.0
      - run: |
          python3 checks/make_trace_fixture.py target/release/remanie-train-harness
          git diff --exit-code checks/fixtures/requests.jsonl
      - run: python3 -m pytest checks/ -q
        env:
          REMANIE_BUNDLE: runtime
      - run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
